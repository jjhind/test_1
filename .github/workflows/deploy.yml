name: Deploy Website Monitor to AWS Lambda

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  TERRAFORM_VERSION: 1.6.0

jobs:
  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -t lambda_package/
          cp lambda_handler.py lambda_package/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true
        working-directory: terraform

      - name: Terraform Init
        id: init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=website-monitor/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}"
        working-directory: terraform

      - name: Terraform Validate
        id: validate
        run: terraform validate
        working-directory: terraform

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan \
            -var="website_url=${{ secrets.WEBSITE_URL }}" \
            -var="from_email=${{ secrets.FROM_EMAIL }}" \
            -var="email_password=${{ secrets.EMAIL_PASSWORD }}" \
            -var="to_email=${{ secrets.TO_EMAIL }}" \
            -var="aws_region=${{ env.AWS_REGION }}" \
            -out=tfplan
        working-directory: terraform
        continue-on-error: true

      - name: Terraform Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: terraform apply -auto-approve tfplan
        working-directory: terraform

      - name: Terraform Output
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        id: output
        run: |
          echo "lambda_name=$(terraform output -raw lambda_function_name)" >> $GITHUB_OUTPUT
          echo "state_bucket=$(terraform output -raw state_bucket_name)" >> $GITHUB_OUTPUT
        working-directory: terraform

      - name: Test Lambda Function
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          aws lambda invoke \
            --function-name ${{ steps.output.outputs.lambda_name }} \
            --payload '{}' \
            response.json
          cat response.json

      - name: Deployment Summary
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          echo "## Deployment Successful! 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Resources Created:" >> $GITHUB_STEP_SUMMARY
          echo "- **Lambda Function**: ${{ steps.output.outputs.lambda_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **State Bucket**: ${{ steps.output.outputs.state_bucket }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Region**: ${{ env.AWS_REGION }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps:" >> $GITHUB_STEP_SUMMARY
          echo "1. Check CloudWatch Logs for function execution" >> $GITHUB_STEP_SUMMARY
          echo "2. Verify EventBridge rule is enabled" >> $GITHUB_STEP_SUMMARY
          echo "3. Monitor email notifications" >> $GITHUB_STEP_SUMMARY

      - name: Upload Terraform Plan
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: terraform/tfplan
          retention-days: 5

  cleanup:
    name: Cleanup Old Lambda Packages
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Remove build artifacts
        run: |
          rm -rf lambda_package
          echo "Cleaned up lambda_package directory"
